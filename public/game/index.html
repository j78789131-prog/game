<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101720"><title>Paris Drive</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8c6d9;font-family:Inter,system-ui,Segoe UI,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(9,16,25,.74);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);border-radius:15px;padding:12px 15px;box-shadow:0 12px 34px #06101b44}.top{position:absolute;top:16px;left:16px;display:flex;gap:10px;align-items:center}.brand{font-size:12px;letter-spacing:.2em;color:#c7d5e4}.speed{position:absolute;right:18px;top:18px;text-align:right}.speed strong{font-size:32px;font-variant-numeric:tabular-nums}.speed small{display:block;color:#b7c6d5;font-size:10px;letter-spacing:.16em}.help{position:absolute;left:18px;bottom:18px;max-width:260px;font-size:12px;color:#d3dfeb}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;opacity:.55}.controls{pointer-events:auto;position:absolute;bottom:22px;right:18px;display:flex;gap:10px;align-items:end}.steer{display:flex;gap:8px}.control{width:58px;height:58px;border:1px solid #ffffff40;border-radius:18px;background:#111b2bc9;color:white;font-size:24px;touch-action:none;user-select:none}.control:active,.control.down{background:#f5a623;color:#101720}.pedals{display:flex;flex-direction:column;gap:8px}.pedals button{width:66px;height:42px;font-size:11px;font-weight:800;letter-spacing:.1em}.status{color:#c8d8e8;font-size:10px;letter-spacing:.12em;margin-top:3px}@media(min-width:850px){.controls{opacity:.78}.help{max-width:330px}}
</style>
</head>
<body>
<div id="hud">
  <div class="top"><div class="glass"><div class="brand">PARIS DRIVE / 001</div><div style="font-size:20px;font-weight:800;margin-top:4px">CITY CRUISE</div><div class="status" id="status">INITIALIZING CITY…</div></div></div>
  <div class="speed glass"><small>VELOCITY</small><strong id="speed">000</strong> <span style="color:#bdcad6">km/h</span><div class="status">D · <span id="gear">1</span></div></div>
  <div class="center">+</div>
  <div class="help glass">Explore Paris. <b>W / ↑</b> accelerate · <b>S / ↓</b> brake · <b>A/D</b> steer · <b>Space</b> handbrake<br><span style="opacity:.65">Prototype build · landmarks and vehicle physics are being expanded.</span></div>
  <div class="controls">
    <div class="steer"><button class="control" data-key="ArrowLeft">‹</button><button class="control" data-key="ArrowRight">›</button></div>
    <div class="pedals"><button class="control" data-key="ArrowUp">GAS</button><button class="control" data-key="ArrowDown">BRAKE</button></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body></html>
