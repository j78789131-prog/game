name: Build Android APK with Expo EAS

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Android app dependencies
        working-directory: apps/android
        run: npm install
      - name: Initialize Expo EAS project
        working-directory: apps/android
        run: npx eas-cli@latest init --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Build installable Android APK
        working-directory: apps/android
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GAME_URL: https://driving-game-4w88.onrender.com/game/
