name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "public/game/**"
      - ".github/workflows/windows-build.yml"

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/windows/package.json
      - run: npm install
      - run: npm run dist
        env:
          GAME_URL: https://YOUR-RENDER-SERVICE.onrender.com/game/
      - uses: actions/upload-artifact@v4
        with:
          name: Paris-Drive-Windows-Installer
          path: apps/windows/release/*.exe
          if-no-files-found: error
          retention-days: 30
